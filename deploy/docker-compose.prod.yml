# Production stack: Postgres + API + web + Caddy (automatic HTTPS) + nightly backups.
#   cp deploy/.env.example deploy/.env   # fill it in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: cafe-pos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host: only the API talks to the database.

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: 3001
      # 'false' only for a cafe laptop without a domain (plain http on the local network).
      COOKIE_SECURE: '${COOKIE_SECURE:-true}'
      LOG_FORMAT: json
      PRINT_MODE: ${PRINT_MODE:-agent}
      BUSINESS_TIMEZONE: Africa/Addis_Ababa
      BUSINESS_UTC_OFFSET_HOURS: 3
      TRUST_PROXY_HOPS: 2
      APP_VERSION: ${APP_VERSION:-prod}
      # Settings → Danger zone reset stays OFF on the live system unless you set this to true.
      ALLOW_DATA_RESET: ${ALLOW_DATA_RESET:-false}
    volumes:
      - uploads:/app/apps/api/uploads

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args: { API_ORIGIN: 'http://api:3001' }
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/uploads:ro
    entrypoint: ['/bin/sh', '-c', 'apk add --no-cache gnupg >/dev/null && while true; do /bin/sh /backup.sh; sleep 86400; done']

volumes:
  pgdata:
  uploads:
  caddy_data:
